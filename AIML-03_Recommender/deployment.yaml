apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommender-api-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: recommender-api
  template:
    metadata:
      labels:
        app: recommender-api
    spec:
      containers:
      - name: recommender-api
        image: recommender-api:latest
        imagePullPolicy: Never
        ports:
        - containerPort: 8000